<!doctype html>
<html lang="en"><head><script>/* GitHub Pages runtime for the CIL MSR platform (21-Oct-2026): sign-in and data are handled in the browser.
   Each person's numbers are encrypted; only their Login ID + PIN unlocks them. Feedback / usage go to the Apps Script web app. */
(function(){
var SITE={feedbackUrl:"",version:"202610250726"};
var enc=new TextEncoder(),dec=new TextDecoder();
function b64d(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return("0"+b.toString(16)).slice(-2)}).join("")}
async function sha(t){return hex(await crypto.subtle.digest("SHA-256",enc.encode(t)))}
async function aes(raw,iv,ct){var k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},k,ct))}
async function gunzip(u8){var s=new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"));return new Uint8Array(await new Response(s).arrayBuffer())}
var BAD={error:"That email and employee code do not match. Use your Smollan email and your employee code, or ask your supervisor."};
async function login(id,pin){
  id=String(id||"").trim().toUpperCase();pin=String(pin||"").trim().toUpperCase();
  var r=await fetch("k/"+(await sha("cil|"+id))+".json?v="+SITE.version,{cache:"no-store"});
  if(!r.ok)return BAD;
  var j=await r.json();
  var base=await crypto.subtle.importKey("raw",enc.encode(pin),"PBKDF2",false,["deriveBits"]);
  var bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64d(j.salt),iterations:j.iter},base,256);
  try{var b=JSON.parse(dec.decode(await aes(bits,b64d(j.iv),b64d(j.ct))))}catch(e){return BAD}
  b.exp=Date.now()+30*864e5;
  post("logEvent","L1",b.user,["sign-in",""]).catch(function(){});
  setTimeout(logoutBtn,300);
  return {token:"L1."+btoa(unescape(encodeURIComponent(JSON.stringify(b)))),user:b.user};
}
function relabel(){try{document.querySelectorAll("label,div,span,p,input").forEach(function(e){
  if(e.tagName==="INPUT"){var ph=(e.placeholder||"");if(/login id/i.test(ph))e.placeholder="name.code@smollan.net";else if(/^pin/i.test(ph))e.placeholder="e.g. 300349";
    if(e.type==="password"||/pin/i.test(e.id+e.name)){e.setAttribute("inputmode","text");e.removeAttribute("maxlength");e.removeAttribute("pattern")}return}
  if(e.children.length)return;var t=e.textContent.trim();
  if(/Sign in with your login ID and PIN/i.test(t))e.textContent="Sign in with your Smollan email and employee code."})}catch(x){}}
function logos(){try{
  var gc=document.getElementById("gateCard");
  if(gc&&gc.querySelector("input")&&!document.getElementById("lgSm")){var d=document.createElement("div");d.id="lgSm";d.style.cssText="text-align:center;margin:0 0 14px";
    d.innerHTML='<img src="img/smollan.png" alt="Smollan" style="height:64px;border-radius:12px">';gc.insertBefore(d,gc.firstChild)}
  var bar=document.querySelector("#topbar .bar");
  if(bar&&!document.getElementById("lgHd")){var h=document.createElement("div");h.id="lgHd";h.style.cssText="display:flex;gap:8px;align-items:center;margin-right:10px";
    h.innerHTML='<img src="img/smollan.png" alt="Smollan" style="height:32px;border-radius:6px"><img src="img/chandaria.png" alt="Chandaria" style="height:32px;background:#fff;border-radius:6px;padding:2px">';bar.insertBefore(h,bar.firstChild)}
 }catch(x){}}
document.addEventListener("DOMContentLoaded",function(){relabel();logos();try{var g=document.getElementById("gate")||document.body;new MutationObserver(function(){relabel();logos()}).observe(g,{childList:true,subtree:true})}catch(x){}});
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function showHL(h){var tries=0;(function go(){var host=document.getElementById("t-overview");
  if(!host){if(++tries<40)setTimeout(go,250);return}
  var old=document.getElementById("hlCard");if(old)old.remove();
  var n=h.outletCount||0,items=(h.outlets||[]).map(function(o){var w=[];if(o.no)w.push(o.no+" promo SKU"+(o.no>1?"s":"")+" not running");if(o.flip)w.push(o.flip+" Yes then No");
    return '<li><b>'+esc(o.outlet)+'</b> · '+esc(o.account)+'<br><small>'+esc(w.join(", "))+(o.skus.length?' – e.g. '+esc(o.skus.join(", ")):"")+'</small></li>'}).join("");
  var end=(h.ending||[]).map(function(e){return '<li>'+esc(e.title)+' <small>– ends '+esc(new Date(e.end+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"}))+'</small></li>'}).join("");
  var c=document.createElement("section");c.id="hlCard";c.className="panel";
  c.style.cssText="border:1px solid #e0a43a;border-left:6px solid #e0a43a;margin:12px 0";
  c.innerHTML='<h3 style="margin-top:0">Follow up</h3>'+
    (n?'<p><b>'+n+'</b> outlet'+(n>1?"s":"")+' with promo SKUs not running or Yes-then-No'+(n>12?" (worst 12 shown)":"")+':</p><ul style="padding-left:18px;margin:6px 0">'+items+'</ul>':'<p>No outlets to chase on promos – everything checked is running. 👍</p>')+
    '<p style="margin:8px 0 0">'+(h.live||0)+' promo'+((h.live||0)==1?"":"s")+' running in your accounts now – see the <b>Running</b> tab.</p>'+
    (end?'<p style="margin:8px 0 2px"><b>Ending in the next 3 days:</b></p><ul style="padding-left:18px;margin:4px 0">'+end+'</ul>':"")+
    (h.report?'<p class="note" style="opacity:.7;margin-top:8px">From '+esc(h.report)+'</p>':"");
  host.insertBefore(c,host.firstChild)})()}
function logoutBtn(){if(document.getElementById("lgBtn"))return;var b=document.createElement("button");b.id="lgBtn";b.type="button";b.textContent="Log out";
  b.style.cssText="position:fixed;right:12px;bottom:12px;z-index:9999;padding:8px 14px;border-radius:18px;border:1px solid #888;background:#1f2a30;color:#fff;font:600 13px system-ui;cursor:pointer;opacity:.9";
  b.onclick=function(){try{localStorage.clear();sessionStorage.clear()}catch(e){}location.href=location.pathname.replace(/[^\/]*$/,"")+"?out="+Date.now()};document.body.appendChild(b)}
function tok(t){try{if(!t||t.indexOf("L1.")!==0)return null;var b=JSON.parse(decodeURIComponent(escape(atob(t.slice(3)))));return b.exp>Date.now()?b:null}catch(e){return null}}
async function data(t,sys){
  var b=tok(t);if(!b)return null;sys=String(sys)==="ib"?"ib":"core";
  var e=b.keys[sys];if(!e)throw new Error("There is no "+sys.toUpperCase()+" data for this login.");
  var r=await fetch("data/"+e.f+".bin?v="+SITE.version,{cache:"no-store"});
  if(!r.ok)throw new Error("The data has not been published yet. Try again in a few minutes.");
  var buf=new Uint8Array(await r.arrayBuffer());
  post("logEvent","L1",b.user,["open",sys.toUpperCase()]).catch(function(){});
  var txt=dec.decode(await gunzip(await aes(b64d(e.k),buf.slice(0,12),buf.slice(12))));
  /* 22-Oct-2026: Follow-up note removed from the overview (Charles) - the Promos tab now shows what is pending */
  return txt;
}
async function post(fn,t,user,args){
  if(!SITE.feedbackUrl||SITE.feedbackUrl.indexOf("http")!==0)return {error:"Feedback is not connected yet."};
  var r=await fetch(SITE.feedbackUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({fn:fn,user:user,proof:user&&user.fb,args:args})});
  return r.json();
}
function viaPost(fn){return function(t){var b=tok(t);return post(fn,t,b&&b.user,Array.prototype.slice.call(arguments,1))}}
var H={login:login,resume:async function(t){var b=tok(t);if(b)setTimeout(logoutBtn,300);return b?b.user:null},getData:data,getPortalData:data,
  logEvent:function(t){var b=tok(t);return post("logEvent",t,b&&b.user,Array.prototype.slice.call(arguments,1)).catch(function(){return true})},
  submitFeedback:viaPost("submitFeedback"),getFeedback:viaPost("getFeedback"),respondFeedback:viaPost("respondFeedback")};
function runner(ok,fail){return new Proxy({},{get:function(_,p){
  if(p==="withSuccessHandler")return function(f){return runner(f,fail)};
  if(p==="withFailureHandler")return function(f){return runner(ok,f)};

    .then(function(v){ok&&ok(v)}).catch(function(e){fail&&fail(e)})}}})}
window.google={script:{run:runner(null,null)}};
})();

<style>

<script>
const INIT={"system":(new URLSearchParams(location.search).get("system")||"core").toLowerCase()==="ib"?"ib":"core","portal":true};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const WEB=!!(window.google&&google.script&&google.script.run);
function call(fn,...a){return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a)})}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2600)}
const store={get(){try{return localStorage.getItem("msrportal_token")}catch(e){return null}},set(v){try{v?localStorage.setItem("msrportal_token",v):localStorage.removeItem("msrportal_token")}catch(e){}}};

 alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>',
 bars:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 20v-6M12 20V4M18 20v-9"/></svg>',
 warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17v.5"/></svg>',
 shelf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h18M3 12h18M3 19h18M7 5v3M12 12v3M16 5v3M9 19v-3"/></svg>',
 star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>'};
const VIEWS_TEAM=[["dash","Dashboard"],["msrs","MSR Reports"],["promo","Promo Progress"],["checks","Store Checks"],["feedback","Feedback"]];
// an MSR only ever sees their own report (the server also sends only their rows)
const VIEWS_MSR=[["msr","My Report"],["promo","My Promos"],["checks","Store Checks"],["feedback","Feedback"]];
const isMsr=()=>!!(USER&&USER.role==="MSR");
let VIEWS=VIEWS_TEAM;
let TOKEN=null,USER=null,SYS=(INIT&&INIT.system)||"core";

// ---------------------------------------------------------------- sign in
function gate(html){$("gate").hidden=false;$("shell").hidden=true;$("bottomNav").hidden=true;$("gateCard").innerHTML=`<div class="logo"><b>SMOLLAN</b><span>CIL · MSR PORTAL</span></div>`+html}
function showLogin(msg){gate(`<h1>Sign in</h1><p>Use your login ID and PIN to see your team's MSR reports and promo progress.</p>
 <form id="lf" autocomplete="on"><label class="fld">Login ID<input id="lid" autocomplete="username" autocapitalize="characters" required></label>
 <label class="fld">PIN<input id="lpin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
 <button class="bigbtn" id="lbtn">Sign in</button><div class="err" id="lerr" role="alert">${esc(msg||"")}</div></form>`);
 $("lid").focus();
 $("lf").onsubmit=e=>{e.preventDefault();const b=$("lbtn");b.disabled=true;b.textContent="Signing in…";$("lerr").textContent="";
  call("login",$("lid").value.trim(),$("lpin").value.trim()).then(r=>{
   if(!r||r.error){b.disabled=false;b.textContent="Sign in";$("lerr").textContent=r&&r.error||"Sign-in failed. Try again.";return}
   TOKEN=r.token;USER=r.user;store.set(TOKEN);load()}).catch(()=>{b.disabled=false;b.textContent="Sign in";$("lerr").textContent="Could not reach the server. Check your connection and try again."})}}
function load(){if(USER&&USER.project&&!load.done){load.done=1;SYS=String(USER.project).toUpperCase()==="IB"?"ib":"core"}
 gate(`<h1>Loading…</h1><p>Getting your team's latest numbers.</p>`);
 call("getPortalData",TOKEN,SYS).then(j=>{if(!j){store.set(null);showLogin("Your session has ended. Sign in again.");return}boot(JSON.parse(j))})
 .catch(e=>gate(`<h1>Could not load the data</h1><p>${esc(e&&e.message||"Unknown error")}</p><button class="bigbtn" type="button" onclick="load()">Try again</button>`))}
function signOut(){store.set(null);TOKEN=null;USER=null;showLogin()}
(function start(){
 if(!WEB){gate(`<h1>Open the portal link</h1><p>This page works from the web app link (…/exec?view=portal).</p>`);return}
 TOKEN=store.get();if(!TOKEN){showLogin();return}
 gate(`<h1>Signing in…</h1>`);
 call("resume",TOKEN).then(u=>{if(u){USER=u;load()}else{store.set(null);showLogin()}}).catch(()=>showLogin())})();

// ---------------------------------------------------------------- portal
let D,S={view:"dash",period:"7",account:"",msr:"",supervisor:"",q:"",msrLimit:40,yetLimit:20,chkLimit:20};
function boot(data){
 D=data;$("gate").hidden=true;$("shell").hidden=false;$("bottomNav").hidden=false;
 S.account="";S.msr="";S.supervisor="";
 $("whoName").textContent=USER?USER.name:"";$("whoRole").textContent=USER?({SUPERVISOR:"SUPERVISOR",MSR:"MSR",MANAGER:"MANAGER",ADMIN:"SYSTEM ADMIN"}[USER.role]||USER.role):"";
 $("reload").innerHTML=ICON.refresh;$("signOut").innerHTML=ICON.out;
 $("reload").onclick=()=>load();$("signOut").onclick=signOut;
 $("sysSw").hidden=isMsr();document.querySelectorAll("#sysSw button").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.s===SYS);b.onclick=()=>{if(SYS!==b.dataset.s){SYS=b.dataset.s;load()}}});
 VIEWS=isMsr()?VIEWS_MSR:VIEWS_TEAM;$("bottomNav").style.gridTemplateColumns=`repeat(${VIEWS.length},1fr)`;
 const nav=VIEWS.map(([k,l])=>`<button type="button" data-v="${k}">${ICON[k]}<span>${l}</span></button>`).join("");
 $("sideNav").innerHTML=nav;$("bottomNav").innerHTML=VIEWS.map(([k,l])=>`<button type="button" data-v="${k}">${ICON[k]}<span>${l.startsWith("My ")?l:l.split(" ")[0]}</span></button>`).join("");
 document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>go(b.dataset.v));
 if(isMsr()){S.msr=D.scope&&D.scope.msr!=null?String(D.scope.msr):"";S.msrView=D.scope&&D.scope.msr!=null?D.scope.msr:-1;
  if(!["msr","promo","checks","feedback"].includes(S.view))S.view="msr"}
 render();
}
function go(v,extra){if(isMsr()){if(v==="dash"||v==="msrs")v="msr";extra=null;S.msrView=S.msr===""?-1:+S.msr}
 Object.assign(S,{view:v},extra||{});render();scrollTo({top:0});if(WEB&&TOKEN)call("logEvent",TOKEN,"portal",v).catch(()=>{})}

// helpers
const L=()=>D.lists, last=()=>D.lists.date.length-1;
const fi=n=>Math.round(n||0).toLocaleString();
const pct=v=>v==null||isNaN(v)?"–":(Math.round(v*1000)/10).toFixed(v>=.995||v<.1?0:1).replace(/\.0$/,"")+"%";
const tc=s=>String(s??"").toLowerCase().replace(/(^|[\s(\-\/])(\w)/g,(a,b,c)=>b+c.toUpperCase());
const dLab=(i,o={day:"numeric",month:"short"})=>i==null||i<0?"":new Date(D.lists.date[i]+"T00:00").toLocaleDateString(undefined,o);
const dIso=(s,o={day:"numeric",month:"short"})=>s?new Date(String(s).slice(0,10)+"T00:00").toLocaleDateString(undefined,o):"";
const rag=(v,t)=>v==null?"none":v>=t[0]?"good":v>=t[1]?"warn":"bad";
const T=()=>D.targets;
function range(){const n=last();if(n<0)return[0,-1];const ld=new Date(D.lists.date[n]+"T00:00");
 const back=k=>{const c=new Date(ld);c.setDate(c.getDate()-k+1);const iso=c.toISOString().slice(0,10);const i=D.lists.date.findIndex(d=>d>=iso);return i<0?n:i};
 if(S.period==="latest")return[n,n];if(S.period==="7")return[back(7),n];if(S.period==="30")return[back(30),n];
 const mon=D.lists.date[n].slice(0,7);return[D.lists.date.findIndex(d=>d.startsWith(mon)),n]}
const PERIODS=[["latest","Latest day"],["7","Last 7 days"],["mtd","Month to date"],["30","Last 30 days"]];
function pass(r,skip){if(S.account!==""&&skip!=="account"&&r[2]!==+S.account)return false;if(S.supervisor!==""&&skip!=="supervisor"&&r[3]!==+S.supervisor)return false;if(S.msr!==""&&skip!=="msr"&&r[4]!==+S.msr)return false;return true}
function inR(r,a,b){return r[0]>=a&&r[0]<=b}
function agg(rows){const s={osaA:0,osaN:0,sosS:0,sosN:0,plan:0,done:0,adhoc:0,ex:0};for(const r of rows){s.osaA+=r[6];s.osaN+=r[7];s.sosS+=r[8];s.sosN+=r[9];s.plan+=r[10];s.done+=r[11];s.adhoc+=r[12];s.ex+=r[13]}
 s.osa=s.osaN?s.osaA/s.osaN:null;s.sos=s.sosN?s.sosS/s.sosN:null;s.cov=s.plan?s.done/s.plan:null;s.miss=Math.max(0,s.plan-s.done);return s}
// promo rows: region, account, supervisor, msr, store, sku, status, outlet activated
function ppass(r,skip){if(S.account!==""&&r[1]!==+S.account)return false;if(S.supervisor!==""&&r[2]!==+S.supervisor)return false;if(S.msr!==""&&skip!=="msr"&&r[3]!==+S.msr)return false;return true}
function pAgg(rows){const o=new Map();let a=0;for(const r of rows){if(r[6]===0)a++;let q=o.get(r[4]);if(!q){q={a:0,v:0,n:0,run:0,acc:r[1],sup:r[2],msr:r[3],store:r[4]};o.set(r[4],q)}q.n++;if(r[6]===0)q.run++;if(r[7]===1||(r[7]===undefined&&r[6]===0))q.a=1;if(r[6]<4)q.v=1}
 let oa=0;for(const q of o.values())if(q.a)oa++;return{slots:rows.length,run:a,outlets:o.size,act:oa,rate:o.size?oa/o.size:null,map:o}}
function card(o){const t=o.tag||"div";return `<${t} class="card stat"${o.go?` type="button" data-go="${o.go}"`:""}><div class="lab"><span>${o.label}</span><span class="${o.ic[1]}">${ICON[o.ic[0]]}</span></div>
 <div class="num ${o.cls||""}">${o.value}</div>${o.sub?`<div class="sub">${o.sub}</div>`:""}${o.meter!=null?`<div class="meter"><i class="bg-${o.mcls||"none"}" style="width:${Math.max(0,Math.min(1,o.meter))*100}%"></i></div>`:""}</${t}>`}
function opts(key,idxs,all){return `<option value="">${all}</option>`+idxs.sort((a,b)=>D.lists[key][a].localeCompare(D.lists[key][b])).map(i=>`<option value="${i}">${esc(tc(D.lists[key][i]))}</option>`).join("")}
function toolbar(withMsr){const [a,b]=range();const F=D.facts;
 const accs=new Set(),sups=new Set(),msrs=new Set();
 for(const r of F){if(!inR(r,a,b))continue;if(pass(r,"account"))accs.add(r[2]);if(pass(r,"supervisor"))sups.add(r[3]);if(pass(r,"msr"))msrs.add(r[4])}
 for(const r of D.promo.rows){if(ppass(r))accs.add(r[1])}
 const showSup=USER&&(USER.role==="MANAGER"||USER.role==="ADMIN");const showMsr=withMsr&&!(USER&&USER.role==="MSR");
 return `<div class="bar"><div class="stamp">${ICON.clock}<span>Data to ${dLab(last(),{weekday:"short",day:"numeric",month:"short"})} · updated ${esc(D.generated)}</span></div>
 <div class="chips">${PERIODS.map(([k,l])=>`<button class="chip" type="button" data-p="${k}" aria-pressed="${S.period===k}">${l}</button>`).join("")}
 ${showSup?`<select class="sel" id="fSup" aria-label="Supervisor">${opts("supervisor",[...sups],"All supervisors")}</select>`:""}
 <select class="sel" id="fAcc" aria-label="Account">${opts("account",[...accs],"All accounts")}</select>
 ${showMsr?`<select class="sel" id="fMsr" aria-label="MSR">${opts("msr",[...msrs],"All MSRs")}</select>`:""}</div></div>`}
function wireToolbar(){document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.period=b.dataset.p;render()});
 [["fSup","supervisor"],["fAcc","account"],["fMsr","msr"]].forEach(([id,k])=>{const el=$(id);if(!el)return;el.value=S[k];el.onchange=()=>{S[k]=el.value;if(k==="supervisor")S.msr="";render()}})}

function render(){
 const v=S.view==="msr"&&!isMsr()?"msrs":S.view;
 document.querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-current",b.dataset.v===v?"page":"false"));
 const title=(isMsr()?{msr:"My Report",promo:"My Promos"}:{})[S.view]||{dash:"Dashboard",msrs:"MSR Reports",msr:"MSR Report",promo:"Promo Progress",checks:"Store Checks",feedback:"Feedback"}[S.view];
 $("ttl").textContent=title+(SYS==="ib"?" · IB":"");document.title=`${title} · CIL MSR Portal`;
 if(S.view==="dash")viewDash();else if(S.view==="msrs")viewMsrs();else if(S.view==="msr")viewMsr();else if(S.view==="promo")viewPromo();else if(S.view==="checks")viewChecks();else viewFeedback();
 wireToolbar();document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}
function teamRows(rows){const g=new Map();for(const r of rows){(g.get(r[4])||g.set(r[4],[]).get(r[4])).push(r)}
 const pr=new Map();for(const r of D.promo.rows){if(!ppass(r,"msr"))continue;(pr.get(r[3])||pr.set(r[3],[]).get(r[3])).push(r)}
 return [...g].map(([id,rs])=>{const s=agg(rs),p=pAgg(pr.get(id)||[]);let lastD=-1,sup=new Map();for(const r of rs){if((r[11]>0||r[7]>0)&&r[0]>lastD)lastD=r[0];sup.set(r[3],(sup.get(r[3])||0)+1)}
  return {id,name:tc(D.lists.msr[id]),sup:tc(D.lists.supervisor[[...sup].sort((a,b)=>b[1]-a[1])[0][0]]),s,p,lastD}})}

// ---------------------------------------------------------------- dashboard
function viewDash(){const [a,b]=range(),n=last(),F=D.facts;
 const day=agg(F.filter(r=>r[0]===n&&pass(r))),per=agg(F.filter(r=>inR(r,a,b)&&pass(r)));
 const p=pAgg(D.promo.rows.filter(r=>ppass(r)));
 const xd=new Set();for(const r of D.prop.rows)if(inR(r,a,b)&&pass(r)&&r[7]>0)xd.add(r[5]);
 const pl=PERIODS.find(x=>x[0]===S.period)[1].toLowerCase(),t=T();
 const team=teamRows(F.filter(r=>inR(r,a,b)&&pass(r))).sort((x,y)=>(x.s.cov??2)-(y.s.cov??2));
 const below=team.filter(o=>(o.s.cov!=null&&o.s.cov<t.cov[1])||(o.s.osa!=null&&o.s.osa<t.osa[1]));
 $("content").innerHTML=toolbar(true)+`<div class="grid4">
 ${card({label:"Coverage today",ic:["target","blue"],value:pct(day.cov),cls:day.cov==null?"":rag(day.cov,t.cov),sub:`${fi(day.done)} / ${fi(day.plan)} visits · <em class="blue">${fi(day.plan-day.adhoc)} planned</em> · <em class="orange">${fi(day.adhoc)} ad hoc</em>`,meter:day.cov,mcls:rag(day.cov,t.cov)})}
 ${card({label:"Missed today",ic:["alert","bad"],value:fi(day.miss),cls:day.miss?"bad":"good",sub:`of ${fi(day.plan)} visits · ${fi(day.ex)} on leave or off`,tag:"button",go:"msrs"})}
 ${card({label:"Coverage · "+pl,ic:["bars","violet"],value:pct(per.cov),cls:per.cov==null?"":rag(per.cov,t.cov),sub:`${fi(per.done)} / ${fi(per.plan)} visits · <em class="orange">${fi(per.adhoc)} ad hoc</em>`,meter:per.cov,mcls:rag(per.cov,t.cov)})}
 ${card({label:"Missed · "+pl,ic:["warn","orange"],value:fi(per.miss),cls:per.miss?"bad":"good",sub:`of ${fi(per.plan)} visits · ${fi(per.ex)} on leave or off`,tag:"button",go:"msrs"})}
 ${card({label:"On-shelf availability",ic:["shelf","blue"],value:pct(per.osa),cls:rag(per.osa,t.osa),sub:`${fi(per.osaA)} of ${fi(per.osaN)} SKU checks in stock`,meter:per.osa,mcls:rag(per.osa,t.osa)})}
 ${card({label:"Share of shelf",ic:["bars","violet"],value:pct(per.sos),cls:rag(per.sos,t.sos),sub:`Average of ${fi(per.sosN)} readings`,meter:per.sos,mcls:rag(per.sos,t.sos)})}
 ${card({label:"Promo activation",ic:["promo","bad"],value:pct(p.rate),cls:rag(p.rate,t.promo),sub:`${fi(p.act)} of ${fi(p.outlets)} outlets activated`,meter:p.rate,mcls:rag(p.rate,t.promo),tag:"button",go:"promo"})}
 ${card({label:"Extra displays",ic:["star","orange"],value:fi(xd.size),sub:"Outlets with an unpaid display",tag:"button",go:"checks"})}
 </div>
 <div class="card"><h2>Daily trend <small>${dLab(a)} to ${dLab(b)}</small></h2><div class="legend"><span><i style="background:var(--blue)"></i>Coverage</span><span><i style="background:var(--good)"></i>OSA</span><span><i style="background:var(--violet)"></i>SOS</span></div><div class="chart" id="trend"></div><div class="tip" id="tip"></div></div>
 <div class="card"><h2>Team at a glance <small>${team.length} MSRs · lowest coverage first · tap a name for the full report</small></h2>${teamTable(team.slice(0,12))}
 ${team.length>12?`<button class="more" type="button" data-go="msrs">See all ${team.length} MSR reports</button>`:""}</div>
 <div class="card"><h2>Needs attention <small>MSRs below ${pct(t.cov[1])} coverage or ${pct(t.osa[1])} OSA</small></h2>${below.length?`<ul class="list">${below.slice(0,8).map(o=>`<li class="go" data-msr="${o.id}" style="cursor:pointer"><span><b>${esc(o.name)}</b><small>${esc(o.sup)} · ${fi(o.s.miss)} visits missed</small></span><span><span class="pill p-${rag(o.s.cov,t.cov)}">Cov ${pct(o.s.cov)}</span> <span class="pill p-${rag(o.s.osa,t.osa)}">OSA ${pct(o.s.osa)}</span></span></li>`).join("")}</ul>`:'<p class="empty">Everyone is above the alert levels for this period.</p>'}</div>`;
 drawTrend(F.filter(r=>inR(r,a,b)&&pass(r)),a,b);wireMsrLinks()}
function teamTable(list){const t=T();if(!list.length)return '<p class="empty">No field data for this selection.</p>';
 return `<div class="tbl"><table><thead><tr><th>MSR</th><th>Coverage</th><th>Visits done</th><th>Missed</th><th>OSA</th><th>SOS</th><th>Promo outlets</th><th>Last active</th></tr></thead><tbody>${
 list.map(o=>`<tr class="go" data-msr="${o.id}" tabindex="0"><td><b>${esc(o.name)}</b><small>${esc(o.sup)}</small></td><td><span class="pill p-${rag(o.s.cov,t.cov)}">${pct(o.s.cov)}</span></td><td>${fi(o.s.done)} / ${fi(o.s.plan)}</td><td class="${o.s.miss?"bad":""}">${fi(o.s.miss)}</td>
 <td><span class="pill p-${rag(o.s.osa,t.osa)}">${pct(o.s.osa)}</span></td><td>${pct(o.s.sos)}</td><td>${o.p.outlets?`${fi(o.p.act)} / ${fi(o.p.outlets)}`:"–"}</td><td>${o.lastD>=0?dLab(o.lastD,{weekday:"short",day:"numeric",month:"short"}):"–"}</td></tr>`).join("")}</tbody></table></div>`}
function wireMsrLinks(){document.querySelectorAll("[data-msr]").forEach(el=>{const f=()=>go("msr",{msrView:+el.dataset.msr});el.onclick=f;el.onkeydown=e=>{if(e.key==="Enter")f()}})}

function lineChart(el,days,series,t){
 const W=Math.max(320,el.clientWidth||800),H=W<520?200:240,pl=40,pr=12,pt=12,pb=26;
 const all=series.flatMap(s=>s.vals).filter(v=>v!=null);if(!all.length){el.innerHTML='<p class="empty">No readings for this period.</p>';return}

 <label class="fld">Your feedback<textarea id="fbM" maxlength="2000" required placeholder="${role==="MSR"?"For example: Naivas Kisumu has not received the Velvex order since Monday.":role==="SUPERVISOR"?"For example: Ruth missed 3 visits this week because of a wrong call cycle; please correct it.":"For example: Quickmart promo activation is behind in Nairobi."}"></textarea></label>
 <button class="bigbtn" id="fbS" style="max-width:260px">Send feedback</button></form></div>
 <div class="card"><h2>Feedback <button class="back" type="button" id="fbR">Refresh</button></h2>
 <div class="chips" style="margin-bottom:8px">${tabs.map(([k,l])=>`<button class="chip" type="button" data-fbt="${k}" aria-pressed="${FB.tab===k}">${l}</button>`).join("")}</div>
 <div class="chips" style="margin-bottom:6px">${[["","Any status"],["New","New"],["In progress","In progress"],["Resolved","Resolved"],["Not an issue","Not an issue"]].map(([k,l])=>`<button class="chip" type="button" data-fbs="${k}" aria-pressed="${FB.status===k}">${l}</button>`).join("")}</div>
 <div id="fbList"><p class="empty">Loading…</p></div></div>`;
 $("fbf").onsubmit=e=>{e.preventDefault();const m=$("fbM").value.trim();if(m.length<5){toast("Write a little more so the team can act on it.");return}const b=$("fbS");b.disabled=true;b.textContent="Sending…";
  const v=id=>$(id)?$(id).value:"";
  call("submitFeedback",TOKEN,{kpi:$("fbK").value,type:$("fbT").value,message:m,system:SYS.toUpperCase(),tab:"portal",outlet:v("fbO"),msr:v("fbP"),
   filters:[v("fbS2")&&"supervisor="+v("fbS2"),v("fbA")&&"account="+v("fbA")].filter(Boolean).join("; "),dataVersion:D.generated,period:S.period,project:SYS.toUpperCase()})
  .then(r=>{b.disabled=false;b.textContent="Send feedback";if(r&&r.ok){$("fbM").value="";toast(`Feedback sent (${r.id}). Thank you.`);loadFb()}else toast(r&&r.error||"Could not send. Try again.")})
  .catch(()=>{b.disabled=false;b.textContent="Send feedback";toast("Could not send. Check your connection.")})};
 document.querySelectorAll("[data-fbt]").forEach(x=>x.onclick=()=>{FB.tab=x.dataset.fbt;FB.limit=30;viewFeedbackList();document.querySelectorAll("[data-fbt]").forEach(y=>y.setAttribute("aria-pressed",y===x))});
 document.querySelectorAll("[data-fbs]").forEach(x=>x.onclick=()=>{FB.status=x.dataset.fbs;FB.limit=30;viewFeedbackList();document.querySelectorAll("[data-fbs]").forEach(y=>y.setAttribute("aria-pressed",y===x))});
 $("fbR").onclick=loadFb;if(FB.rows)viewFeedbackList();loadFb()}
function loadFb(){call("getFeedback",TOKEN).then(r=>{if(!r||r.error){if($("fbList"))$("fbList").innerHTML=`<p class="empty">${esc(r&&r.error||"Could not load feedback.")}</p>`;return}FB.rows=r.rows;FB.statuses=r.statuses;if(S.view==="feedback")viewFeedbackList()})
 .catch(()=>{if($("fbList"))$("fbList").innerHTML='<p class="empty">Could not load feedback. Check your connection.</p>'})}
const stBadge=s=>({New:"p-bad","In progress":"p-warn",Resolved:"p-good","Not an issue":"p-none"}[s]||"p-none");
function viewFeedbackList(){const el=$("fbList");if(!el||!FB.rows)return;
 let rows=FB.rows.filter(f=>FB.tab==="mine"?f.mine:FB.tab==="team"?!f.mine:true).filter(f=>!FB.status||f.status===FB.status);
 el.innerHTML=rows.length?`<ul class="list">${rows.slice(0,FB.limit).map(f=>`<li style="display:block"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><span><b>${esc(f.kpi)} · ${esc(f.type)}</b>
  <small>${esc(f.mine?"You":f.name)}${f.mine?"":` (${esc({MSR:"MSR",SUPERVISOR:"Supervisor",MANAGER:"Manager",ADMIN:"Admin"}[f.role]||tc(f.role))}${f.supervisor&&f.role==="MSR"?`, ${esc(tc(f.supervisor))}'s team`:""})`} · ${esc(f.when)} · ${esc(f.fid)}${f.msr?` · MSR ${esc(tc(f.msr))}`:""}${f.outlet?` · ${esc(tc(f.outlet))}`:""}</small></span><span class="badge ${stBadge(f.status)}">${esc(f.status)}</span></div>
  <p style="margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere">${esc(f.message)}</p>
  ${f.response?`<p style="margin:8px 0 0;padding:8px 10px;background:#F2F4F8;border-radius:10px;font-size:14px"><b style="display:inline">${esc(f.owner)}:</b> ${esc(f.response)} <small>${esc(f.respondedOn)}</small></p>`:""}
  ${f.canAnswer?`<form class="ans" data-fid="${esc(f.fid)}" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><select class="sel" aria-label="Status">${(FB.statuses||["New","In progress","Resolved","Not an issue"]).map(s=>`<option${s===f.status?" selected":""}>${s}</option>`).join("")}</select>
   <input class="search" style="flex:1;min-width:180px;max-width:none" placeholder="Reply to ${esc(f.name.split(" ")[0])}" value="${esc(f.response)}" aria-label="Reply"><button class="chip" type="submit" aria-pressed="true">Save</button></form>`:""}</li>`).join("")}</ul>
  ${rows.length>FB.limit?`<button class="more" type="button" id="fbMore">Show all ${rows.length}</button>`:""}`
  :`<p class="empty">${FB.tab==="team"?"No feedback from your team yet.":"No feedback here yet."}</p>`;
 if($("fbMore"))$("fbMore").onclick=()=>{FB.limit=1e9;viewFeedbackList()};
 el.querySelectorAll("form.ans").forEach(f=>f.onsubmit=e=>{e.preventDefault();const btn=f.querySelector("button");btn.disabled=true;
  call("respondFeedback",TOKEN,f.dataset.fid,f.querySelector("select").value,f.querySelector("input").value).then(r=>{btn.disabled=false;if(r&&r.ok){toast("Saved");loadFb()}else toast(r&&r.error||"Could not save.")}).catch(()=>{btn.disabled=false;toast("Could not save. Check your connection.")})})}

let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(D&&(S.view==="dash"||S.view==="msr"||S.view==="promo"))render()},250)});
</script></body></html>
